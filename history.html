<meta charset="utf-8">
<script>if (!window.box) location.replace('/' + (location.pathname.includes('history') ? '#/history' : ''));</script>
<div class="center flex-col gap-5 w-full">
  <!-- Brand & Header -->
  <div class="w-full flex items-center justify-between flex-wrap gap-2 border-b border-slate-200/80 pb-3">
    <div class="flex items-center gap-3">
      <a href="home.html" id="btnBackHome" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium text-slate-600 hover:text-blue-600 px-2.5 py-1.5 rounded-lg hover:bg-white/80 border border-transparent hover:border-slate-200/80 transition shadow-2xs" title="返回解析首页">
        <i class="bi-arrow-left"></i><span>返回首页</span>
      </a>
      <div class="h-4 w-px bg-slate-200"></div>
      <h1 class="text-lg sm:text-xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
        <i class="bi-clock-history text-blue-600"></i>
        <span>解析历史记录</span>
      </h1>
      <span id="historyTotalCount" class="text-xs px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 font-mono font-semibold border border-blue-200/50">0 条</span>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" id="btnClearAllHistory" class="inline-flex items-center gap-1 text-xs font-medium text-red-600 hover:text-red-700 hover:bg-red-50/80 px-2.5 py-1.5 rounded-lg border border-red-200/80 transition cursor-pointer shadow-2xs" title="清空本地所有历史解析记录">
        <i class="bi-trash3"></i><span>清空历史</span>
      </button>
    </div>
  </div>

  <!-- Description Notice -->
  <div class="w-full glass-card p-3.5 text-xs text-slate-600 flex items-start gap-2.5 shadow-xs">
    <i class="bi-info-circle text-blue-500 mt-0.5 shrink-0 text-sm"></i>
    <div class="space-y-0.5 text-slate-500 leading-relaxed">
      <p>历史记录安全保存在本地浏览器中（最多保留 100 条），支持随时复制直链、导出 cURL/IDM 或一键推送到 Motrix。</p>
      <p class="text-[11px] text-slate-400">提示：百度 PCS 直链通常有数小时有效期。如遇直链过期，可点击「重解」自动回填并重新获取最新直链。</p>
    </div>
  </div>

  <!-- Search & Filter Toolbar -->
  <div class="w-full flex items-center gap-2">
    <div class="relative flex-auto">
      <i class="bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input type="text" id="historySearchInput" class="w-full pl-9 pr-9 py-2.5 text-xs sm:text-sm bg-white/95 border border-slate-200/90 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition shadow-xs" placeholder="按文件名或短链筛选历史记录..." autocomplete="off">
      <button type="button" id="btnClearSearch" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs p-1 cursor-pointer" title="清除筛选">
        <i class="bi-x-circle-fill"></i>
      </button>
    </div>
  </div>

  <!-- Empty State -->
  <div id="historyEmptyState" class="hidden w-full flex flex-col items-center justify-center py-16 px-4 text-center border border-dashed border-slate-200/90 rounded-2xl bg-white/60 backdrop-blur-xs">
    <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 text-2xl mb-3">
      <i class="bi-inbox"></i>
    </div>
    <p class="text-sm font-semibold text-slate-700">暂无历史解析记录</p>
    <p class="text-xs text-slate-400 mt-1 max-w-sm">解析成功的直链将自动保存在这里，方便随时取用与导出。</p>
    <a href="home.html" class="mt-4 inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-medium rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition shadow-xs">
      <i class="bi-cloud-arrow-down"></i><span>前往解析文件</span>
    </a>
  </div>

  <!-- History Table Container -->
  <div id="historyTableContainer" class="min-h-64 w-full overflow-x-auto">
    <table class="simple w-full text-slate-700">
      <thead class="text-xs uppercase bg-slate-100/80 text-slate-500 border-b border-slate-200">
        <tr>
          <th class="py-2.5 px-3 text-right w-20 sm:w-24 font-mono">大小</th>
          <th class="py-2.5 px-3 text-left font-sans">文件名称与信息</th>
          <th class="py-2.5 px-3 text-right w-48 sm:w-64 font-sans">操作</th>
        </tr>
      </thead>
      <tbody id="historyTableBody" class="text-xs sm:text-sm divide-y divide-slate-100 font-sans">
        <!-- Rendered by src/history.js -->
      </tbody>
    </table>
  </div>
</div>
